[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maltashop-common"
version = "0.2.0"
description = "Shared event contract and RabbitMQ messaging helpers for the MaltaShop prototype"
requires-python = ">=3.10"
dependencies = ["pika>=1.3,<2", "pydantic>=2.5", "sqlalchemy>=2.0"]

[tool.setuptools]
packages = ["maltashop_common"]
